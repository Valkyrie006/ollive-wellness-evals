services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      # Keys are passed through from your shell or a local .env - never
      # baked into the image or committed.
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in your environment or .env}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?set GOOGLE_API_KEY in your environment or .env}
      # Model IDs are overridable because providers retire them; see
      # docs/DESIGN.md.
      OSS_MODEL: ${OSS_MODEL:-groq/openai/gpt-oss-20b}
      FRONTIER_MODEL: ${FRONTIER_MODEL:-gemini/gemini-3.6-flash}
      JUDGE_MODEL: ${JUDGE_MODEL:-groq/qwen/qwen3.8-27b}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-20}
      # Diagnostics call upstream with the server's key; opt in deliberately.
      ENABLE_DEBUG_ENDPOINTS: ${ENABLE_DEBUG_ENDPOINTS:-false}
    restart: unless-stopped
