name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; nothing here needs write access to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    # Runs first and independently: a leaked key must fail the build even if
    # every test passes.
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan full history, not just the tip commit

      - name: Fail on committed credentials
        run: |
          set -euo pipefail
          PATTERN='gsk_[A-Za-z0-9]{40,}|AIza[A-Za-z0-9_-]{30,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{50,}'
          if git log -p --all | grep -nE "$PATTERN"; then
            echo "::error::A credential-shaped string was found in git history."
            exit 1
          fi
          if git log --all --name-only --pretty=format: | sort -u | grep -qx '.env'; then
            echo "::error::.env has been committed at some point in history."
            exit 1
          fi
          echo "No credentials found in history."

  test:
    name: Lint and test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU wheels only: the default torch build pulls gigabytes of CUDA
          # libraries that a CI runner will never use.
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Test
        # No API keys are set, by design - the suite must pass with every
        # network dependency faked.
        run: python -m pytest tests/ -q
