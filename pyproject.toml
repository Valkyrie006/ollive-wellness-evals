[project]
name = "wellness-assistant-evals"
version = "1.0.0"
description = "Two wellness assistants on one fixed architecture, with an LLM-as-judge evaluation harness."
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
# Pinned to the OLDEST supported interpreter, not the newest. With py310
# here, ruff suggests 3.10+ idioms (zip(strict=), X | Y at runtime) that
# import fine and then fail at runtime on 3.9 - which is exactly how a
# lint "fix" shipped a production bug in this repo.
target-version = "py39"
exclude = [".venv", "venv", "_to_delete"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "E501",    # line length is handled by the formatter, not worth failing CI over
    "B008",    # FastAPI's Depends()-in-defaults pattern is idiomatic
    "S101",    # assert is how pytest works
    # UP007/UP045 push `X | None` over Optional[...]. Ruff assumes the
    # `from __future__ import annotations` import makes that safe on 3.9 -
    # and for ordinary annotations it does. It is NOT safe for pydantic
    # models, which resolve their annotations eagerly at class creation and
    # raise TypeError on 3.9. Following this rule crash-looped the server
    # once; tests/test_python_compat.py now guards the same thing.
    "UP007",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately use hardcoded fake credentials and sleep for timing.
"tests/*" = ["S105", "S106", "S311"]
